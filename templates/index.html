<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoNovel - AI小説生成</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

  <!-- ===== スタート画面 ===== -->
  <div id="start-screen" class="screen active">
    <div class="container center">
      <div class="logo-area">
        <span class="logo-icon">📖</span>
        <h1 class="app-title">AutoNovel</h1>
        <p class="app-version">Version 0.2.0</p>
        <p class="app-subtitle">AIが紡ぐ、あなただけの物語</p>
      </div>
      <p class="description">
        いくつかの質問に答えるだけで、<br />
        AIがオリジナルの小説を自動生成します
      </p>
      <button class="btn-primary" id="start-btn">はじめる →</button>
    </div>
  </div>

  <!-- ===== プロットシード設定画面 ===== -->
  <div id="plotseed-screen" class="screen">
    <div class="container">
      <div class="question-card">
        <p class="question-step">物語構成の質問</p>
        <h2 class="question-text">プロットシードの使用率を設定してください</h2>
        <p class="description">
          物語の展開の型となる「プロットシード」を、スライダーで指定した割合だけ抽出して物語に反映します。<br />
          下のプレビューを確認し、気に入らない場合は「やり直す」で再抽選、または直接テキストを編集できます。
        </p>
        <div class="gauge-area">
          <input type="range" id="plotseed-range" min="0" max="100" step="1" value="50" />
          <span class="gauge-value" id="plotseed-value">50%</span>
        </div>
        <div class="plotseed-preview-header">
          <span class="plotseed-count-text" id="plotseed-count-text"></span>
          <button class="btn-icon" id="plotseed-reroll-btn">🔄 やり直す</button>
        </div>
        <textarea
          class="plotseed-textarea"
          id="plotseed-textarea"
          rows="10"
          placeholder="使用率が0%の場合、プロットシードは使用されません"
        ></textarea>
      </div>
      <div class="nav-buttons">
        <button class="btn-primary" id="plotseed-next-btn">次へ →</button>
      </div>
    </div>
  </div>

  <!-- ===== 質問画面 ===== -->
  <div id="question-screen" class="screen">
    <div class="container">
      <div class="progress-container">
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="progress-text" id="progress-text">1 / 6</span>
      </div>

      <div class="question-card" id="question-card">
        <p class="question-step" id="question-step">質問 1</p>
        <h2 class="question-text" id="question-text"></h2>
        <div class="options-grid" id="options-grid"></div>
        <div class="text-input-area" id="text-input-area">
          <textarea class="plotseed-textarea" id="text-input-textarea" rows="5"></textarea>
          <button class="btn-primary" id="text-input-next-btn">次へ →</button>
        </div>
      </div>

      <div class="nav-buttons">
        <button class="btn-secondary" id="prev-btn">← 戻る</button>
      </div>
    </div>
  </div>

  <!-- ===== ローディング画面 ===== -->
  <div id="loading-screen" class="screen">
    <div class="container center">
      <span class="loading-icon">✍️</span>
      <h2 class="loading-title">小説を執筆中...</h2>
      <p class="loading-status" id="loading-status">AIが物語を構想しています</p>
      <div class="dot-loader">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- ===== 結果画面 ===== -->
  <div id="result-screen" class="screen">
    <div class="container wide">
      <div class="result-header">
        <h2 class="result-title">✨ 小説が完成しました</h2>
        <div class="result-actions">
          <button class="btn-icon" id="copy-btn">📋 コピー</button>
          <button class="btn-icon" id="download-btn">💾 保存</button>
          <button class="btn-secondary" id="restart-btn">🔄 もう一度</button>
        </div>
      </div>
      <div class="novel-container">
        <div class="novel-content" id="novel-content"></div>
      </div>
    </div>
  </div>

  <script>
    const QUESTIONS = {{ questions | tojson }};
  </script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
